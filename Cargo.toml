[package]
name = "sliq"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.8"
graphile_worker = "0.11.2"
rand = "0.10.0"
reqwest = { version = "0.13.2", features = ["json"] }
http = "1.4"
serde = "1.0.228"
serde_json = "1.0.149"
sqlx = { version = "0.8.6", features = ["postgres", "runtime-tokio", "uuid", "json", "chrono"] }
tokio = { version = "1.49.0", features = ["macros", "rt-multi-thread"] }
tower_governor = "0.6"
ulid = "1.2.1"
sha2 = "0.10"
hex = "0.4"
dotenvy = "0.15.7"
thiserror = "2.0.18"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4.44", features = ["serde"] }

[dev-dependencies]
wiremock = "0.6"
http-body-util = "0.1"
