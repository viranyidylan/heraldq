# Prometheus alerting rules for HeraldQ.
#
# Load via prometheus.yml:
#   rule_files:
#     - alerts/heraldq.rules.yml
#
# Scrape config — each binary exports on its own METRICS_PORT:
#   scrape_configs:
#     - job_name: heraldq-api
#       static_configs: [{ targets: ["api-host:9464"] }]
#     - job_name: heraldq-worker
#       static_configs: [{ targets: ["worker-host:9465"] }]

groups:
  - name: heraldq
    rules:
      # The one that matters most: the worker tried to dead-letter a webhook
      # and the DLQ write itself failed. The job will retry, but if this
      # persists the webhook vanishes with no tenant-visible record — the
      # single silent-data-loss path in the system. Any occurrence pages.
      - alert: HeraldQDlqWriteFailure
        expr: increase(heraldq_dlq_write_failures_total[5m]) > 0
        labels:
          severity: critical
        annotations:
          summary: "HeraldQ failed to write a dead-lettered webhook to the DLQ"
          description: >-
            {{ $value }} DLQ write(s) failed in the last 5 minutes. Webhooks
            that exhaust retries during this condition are lost without a
            tenant-visible record. Check worker logs for [CRITICAL ERROR]
            and Postgres health.

      # Dead-lettering is normal in ones and twos (customer endpoints break).
      # A sustained rate means something systemic: our egress, DNS, or a big
      # tenant's endpoint being down long enough to exhaust 15 retries.
      - alert: HeraldQDeadLetterSpike
        expr: sum(rate(heraldq_webhooks_dead_lettered_total[15m])) > 0.05
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "HeraldQ is dead-lettering webhooks at an elevated rate"
          description: >-
            More than ~45 webhooks/15m are reaching the DLQ. Inspect
            failure_reason in dead_letter_queue for a common cause.

      # Backpressure: the job at the head of the queue has been waiting too
      # long — workers are not keeping up with intake. Age, not depth, is the
      # signal: depth spikes are fine if they drain, but age climbing means
      # we are falling behind. Depth (heraldq_queue_depth) belongs on a
      # dashboard for capacity planning, not in an alert.
      - alert: HeraldQQueueLagging
        expr: heraldq_queue_oldest_job_age_seconds > 60
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "HeraldQ webhook queue is lagging behind intake"
          description: >-
            The oldest runnable job has waited {{ $value | humanizeDuration }}
            (>60s for 5m). Delivery latency is degrading — check worker
            health, delivery duration, and queue depth for the cause.

      # Same signal, drowning threshold. Ten minutes of head-of-line wait
      # means deliveries are effectively stalled for every tenant.
      - alert: HeraldQQueueStalled
        expr: heraldq_queue_oldest_job_age_seconds > 600
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "HeraldQ webhook queue is stalled"
          description: >-
            The oldest runnable job has waited {{ $value | humanizeDuration }}.
            Webhooks are not being delivered at a meaningful rate — worker
            down or wedged, Postgres contention, or intake far beyond
            capacity.

      # Billing drift: a customer whose latest mirrored subscription implies
      # a different tier than their tenant holds. Every drift is money — a
      # paying customer on free (under-served) or a canceled customer on a
      # paid tier (over-served). The poller refreshes every 5 minutes, so a
      # sustained nonzero reading means the tier-propagation path is broken,
      # not merely mid-flight.
      - alert: HeraldQTierDrift
        expr: heraldq_paddle_tier_drift > 0
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "HeraldQ billing tier drift detected"
          description: >-
            {{ $value }} linked customer(s) hold a tier that disagrees with
            their mirrored Paddle subscription (or the subscription carries
            no tier metadata — a live-catalog price missing custom_data.tier).
            Check the webhook receiver and paddle sync logs; the
            repeat-buyer hydration path (PADDLE_API_KEY) is the usual suspect.

      # Stub customers that never hydrated: subscription events arrived but
      # the customer row is still email-less over an hour later. Fresh stubs
      # are normal (customer.created in flight) — the poller only counts
      # those older than an hour.
      - alert: HeraldQStubCustomersLingering
        expr: heraldq_paddle_unhydrated_stubs > 0
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "HeraldQ Paddle stub customers never hydrated"
          description: >-
            {{ $value }} paddle_customers row(s) have no email an hour after
            their last event. Hydration (PADDLE_API_KEY set? Paddle API
            healthy?) or the missing customer.created delivery failed.

      # Someone is paying and no tenant account exists to receive the tier.
      # With signup-first this should be structurally impossible; nonzero
      # means checkout ran without an account (legacy data) or the signup
      # linkage failed.
      - alert: HeraldQTenantlessSubscriptions
        expr: heraldq_paddle_tenantless_subscriptions > 0
        for: 1h
        labels:
          severity: critical
        annotations:
          summary: "HeraldQ paid subscriptions with no linked tenant"
          description: >-
            {{ $value }} active Paddle subscription(s) point at customers
            with no tenant. A payer is not getting what they paid for —
            reconcile by email in paddle_customers vs tenants.

      # Permanent hydration failures are silent by design (the webhook still
      # 200s so Paddle stops retrying): a bad API key or an unknown customer
      # is only visible in this counter. Any occurrence warrants a look.
      - alert: HeraldQHydrationFailures
        expr: increase(heraldq_paddle_hydration_total{outcome="failed"}[30m]) > 0
        labels:
          severity: warning
        annotations:
          summary: "HeraldQ stub hydration permanently failing"
          description: >-
            Hydration hit a permanent Paddle API error (rejected key or
            unknown customer) {{ $value }} time(s) in 30m. The affected
            customer row will not converge on its own.

      # The API is the tenant-facing front door: a 5xx here means we rejected
      # a webhook the customer believes they handed us. 4xx is deliberately
      # excluded — bad keys and malformed payloads are the caller's problem and
      # would drown the signal. Ratio, not absolute count, so the threshold
      # holds at any traffic level.
      - alert: HeraldQApiErrorRate
        expr: >-
          sum(rate(heraldq_http_requests_total{status=~"5.."}[5m]))
            / sum(rate(heraldq_http_requests_total[5m])) > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "HeraldQ API is returning 5xx to tenants"
          description: >-
            {{ $value | humanizePercentage }} of API requests are failing with
            5xx over the last 5m. Intake is degraded — webhooks are being
            rejected at the door. Check api logs (each carries a request_id)
            and Postgres health.

      # Latency is the other half of the front-door SLO: the API only enqueues,
      # so p99 should sit in single-digit milliseconds. A second means Postgres
      # contention or pool exhaustion, and callers will start timing out.
      - alert: HeraldQApiLatencyHigh
        expr: >-
          histogram_quantile(0.99,
            sum by (le) (rate(heraldq_http_request_duration_seconds_bucket[5m]))) > 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "HeraldQ API p99 latency is above 1s"
          description: >-
            p99 request latency is {{ $value | humanizeDuration }}. The API does
            little more than validate and enqueue, so this points at the DB pool
            or Postgres itself rather than handler work.

      # No scrape = no metrics = every rule above is blind. Alert on the
      # blindness itself.
      - alert: HeraldQTargetDown
        expr: up{job=~"heraldq-.*"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "HeraldQ process {{ $labels.job }} is not being scraped"
          description: >-
            {{ $labels.instance }} has been unreachable for 2 minutes —
            process down, METRICS_PORT unset, or network path broken.
