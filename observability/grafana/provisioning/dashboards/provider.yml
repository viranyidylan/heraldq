# Tells Grafana to load dashboard JSON files from the repo so the HeraldQ
# dashboard is version-controlled and identical across local + production.
apiVersion: 1

providers:
  - name: heraldq
    type: file
    allowUiUpdates: true
    options:
      # Exported by observability/grafana.sh. Was a hardcoded absolute path,
      # which only ever worked on one machine.
      path: ${HERALDQ_DASHBOARDS_PATH}
      foldersFromFilesStructure: false
