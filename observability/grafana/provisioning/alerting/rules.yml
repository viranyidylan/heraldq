# Operator alert rules, provisioned from the repo like the dashboard.
#
# Two failure modes a customer would otherwise report before we notice:
#   1. worker dead / drowning  → runnable jobs sit unclaimed, oldest age grows
#   2. delivery failure spike  → DLQ rows accumulate abnormally fast
#
# Where alerts are DELIVERED is deliberately not provisioned here: pick a
# contact point (Slack webhook, email) in the Grafana UI under
# Alerting → Contact points, or provision one — see contactpoints.yml.example.
# Until then, firing alerts are visible under Alerting → Alert rules.
apiVersion: 1

groups:
  - orgId: 1
    name: heraldq-operator
    folder: HeraldQ
    interval: 1m
    rules:
      - uid: heraldq-worker-stalled
        title: Worker stalled or backlog growing
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: heraldq-pg
            model:
              refId: A
              format: table
              rawQuery: true
              # Age (seconds) of the oldest job that is runnable *right now*
              # but unclaimed: not locked by any worker, retries not
              # exhausted, run_at already due. A healthy worker keeps this
              # near zero; a dead worker (or one drowning in backlog) lets
              # it grow without bound. Retry jobs waiting on backoff have
              # run_at in the future and are correctly excluded.
              rawSql: >-
                SELECT COALESCE(EXTRACT(EPOCH FROM (NOW() - MIN(run_at))), 0)::float8 AS value
                FROM graphile_worker._private_jobs
                WHERE attempts < max_attempts
                  AND locked_at IS NULL
                  AND run_at <= NOW()
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: { params: [300], type: gt }
        # 300s threshold + for: 5m + 1m interval ≈ worst-case ~11 min to page.
        for: 5m
        noDataState: OK
        execErrState: Alerting
        labels:
          severity: critical
        annotations:
          summary: >-
            Runnable webhook jobs have been sitting unclaimed for over 5
            minutes. The worker is down, stuck, or drowning in backlog —
            customers' webhooks are not being delivered.

      - uid: heraldq-dlq-spike
        title: DLQ growth spike
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: heraldq-pg
            model:
              refId: A
              format: table
              rawQuery: true
              rawSql: >-
                SELECT COUNT(*)::float8 AS value
                FROM dead_letter_queue
                WHERE abandoned_at > NOW() - interval '1 hour'
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                # >10 dead-letters/hour is a spike at current volume; revisit
                # as tenants grow (or make it a % of deliveries).
                - evaluator: { params: [10], type: gt }
        for: 1m
        noDataState: OK
        execErrState: Alerting
        labels:
          severity: warning
        annotations:
          summary: >-
            More than 10 webhooks dead-lettered in the last hour. Either a
            customer endpoint is hard-down (check /v1/dlq per tenant) or we
            are misclassifying failures.
